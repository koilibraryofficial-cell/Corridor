<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lens — Kingdom of Inner Light</title>
<style>
  /* ===== silence the Squarespace frame on this page ===== */
  #header, .header, header#header, .sqs-announcement-bar-dropzone,
  #footer-sections, footer.sections, .sqs-cookie-banner-v2{display:none !important}
  #page, #siteWrapper, .content-wrapper, article, section.page-section,
  .content, .fluid-engine, .sqs-block, .sqs-block-code{
    padding:0 !important; margin:0 !important; max-width:none !important}
  section.page-section{min-height:0 !important}
  .fluid-engine{display:block !important}
  .sqs-block-code{display:block !important; width:100% !important}
  h1{color:#EFE7D8 !important; font-family:"Palatino Linotype",Palatino,Georgia,serif !important}
  .frame .sub{color:#B7A2EE !important}
  .frame .body{color:#EFE7D8 !important}
  .frame .dim{color:#938BA6 !important}
  .frame p, .frame div{font-family:"Palatino Linotype",Palatino,Georgia,serif}

  :root{
    --ink:#12101A; --ink2:#1A1726; --cream:#EFE7D8; --gold:#C9A44C;
    --violet:#9B7FD4; --dim:#938BA6; --rule:#3A3450;
    --oxblood:#8C3B3B; --forest:#4F7A5B; --indigo:#5C6BC0;
    --black:#2E2B38; --bone:#D8CFBB;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--ink); color:var(--cream);
    font-family:"Palatino Linotype",Palatino,Georgia,serif;
    min-height:100vh; padding:20px;
  }
  .frame{width:100%; max-width:560px; text-align:center; position:relative; z-index:2;
    margin:0 auto; padding:9vh 0 12vh;}
  .veil{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 110%, #1A1424 0%, #12101A 55%, #0B0A12 100%)}
  .ember{position:fixed;border-radius:50%;background:var(--gold);pointer-events:none;z-index:1;
    animation:erise linear infinite, eglow 2.2s ease-in-out infinite}
  @keyframes erise{from{transform:translateY(10vh)}to{transform:translateY(-112vh)}}
  @keyframes eglow{0%,100%{opacity:.12}50%{opacity:.6}}

  /* ===== THE APPROACH — the lens grows nearer with every question ===== */
  .lensglow{position:fixed;left:50%;top:46%;width:min(120vw,760px);height:min(120vw,760px);
    transform:translate(-50%,-50%) scale(.7);border-radius:50%;pointer-events:none;z-index:1;
    background:radial-gradient(circle, rgba(155,127,212,.16) 0%, rgba(155,127,212,.05) 45%, rgba(155,127,212,0) 70%);
    opacity:0;transition:opacity 1.2s ease, transform 1.4s ease}
  .lensglow.heart{animation:lensheart 2.2s ease-in-out infinite}
  @keyframes lensheart{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
  .lensglow.focus{box-shadow:0 0 0 1px rgba(201,164,76,.35), 0 0 60px rgba(201,164,76,.15) inset}
  .deepshade{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity 1s ease;
    background:radial-gradient(90% 75% at 50% 45%, rgba(0,0,0,0) 40%, rgba(4,3,8,.6) 100%)}
  .deepshade.on{opacity:1}
  .floatsigil{position:fixed;pointer-events:none;z-index:1;color:var(--gold);
    opacity:0;font-size:22px;text-shadow:0 0 14px rgba(201,164,76,.6);
    animation:sigildrift var(--sd) ease-in-out forwards}
  @keyframes sigildrift{
    0%{transform:translate(var(--sx0),var(--sy0)) rotate(0deg);opacity:0}
    12%{opacity:var(--so)}
    88%{opacity:var(--so)}
    100%{transform:translate(var(--sx1),var(--sy1)) rotate(35deg);opacity:0}}
  .fallstar{position:fixed;width:1.5px;height:10px;border-radius:2px;z-index:1;pointer-events:none;
    background:linear-gradient(180deg,rgba(239,231,216,0),rgba(239,231,216,.9));
    animation:starfall var(--fd) linear forwards}
  @keyframes starfall{from{transform:translateY(-12vh)}to{transform:translateY(115vh);opacity:0}}

  .kicker{
    font-family:Helvetica,Arial,sans-serif; font-size:11px; letter-spacing:.28em;
    color:var(--gold); text-transform:uppercase; margin-bottom:14px;
  }
  .rule{width:130px;height:1px;margin:0 auto 26px;position:relative;opacity:.9;
    background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .rule:after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;
    transform:translate(-50%,-50%) rotate(45deg);background:var(--ink);
    border:1px solid var(--gold);box-shadow:0 0 10px rgba(201,164,76,.6)}
  h1{font-size:34px; font-weight:400; letter-spacing:.02em; margin-bottom:14px}
  .sub{color:#B7A2EE; font-style:italic; font-size:17px; line-height:1.55; margin-bottom:22px;
    text-shadow:0 0 22px rgba(155,127,212,.5)}
  .body{color:var(--cream); font-size:16px; line-height:1.7; margin-bottom:14px; text-align:left}
  .center{text-align:center}
  .dim{color:var(--dim); font-size:13px; line-height:1.6}
  button.gate-btn, a.gate-btn{
    font-family:Helvetica,Arial,sans-serif; letter-spacing:.18em; text-transform:uppercase;
    font-size:13px; color:#12101A !important; background:var(--gold);
    border:none; padding:16px 34px; cursor:pointer; margin-top:24px;
    text-decoration:none !important; display:inline-block;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  button.gate-btn:hover, a.gate-btn:hover{transform:translateY(-1px); box-shadow:0 0 24px rgba(201,164,76,.35)}
  button.gate-btn:focus-visible, a.gate-btn:focus-visible{outline:2px solid var(--cream); outline-offset:3px}

  /* ===== THE EYE ===== */
  .eyewrap{width:min(62vw,270px);margin:0 auto 18px;
    animation:blink 5.4s ease-in-out infinite;transform-origin:center;
    filter:drop-shadow(0 0 26px rgba(155,127,212,.35))}
  @keyframes blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.05)}96%{transform:scaleY(1)}}
  .iris-ring{animation:irisspin 46s linear infinite;transform-origin:180px 90px}
  @keyframes irisspin{to{transform:rotate(360deg)}}
  .iris-fibers{animation:irisspin 70s linear infinite reverse;transform-origin:180px 90px}
  .pupilglow{animation:pupilbreathe 3s ease-in-out infinite}
  @keyframes pupilbreathe{0%,100%{opacity:.7}50%{opacity:1}}

  .progress{display:flex; gap:6px; justify-content:center; margin-bottom:34px}
  .tick{width:16px; height:3px; background:var(--rule); transition:background .4s ease}
  .tick.lit{background:var(--gold)}
  .qnum{font-family:Helvetica,Arial,sans-serif; font-size:10px; letter-spacing:.3em; color:var(--dim); margin-bottom:10px}
  .question{font-size:22px; line-height:1.45; margin-bottom:26px; color:var(--cream);
    transition:color .8s ease, text-shadow .8s ease}
  .stage.deep .question{color:#CDBCF4; text-shadow:0 0 24px rgba(155,127,212,.55)}
  .question.shiver{animation:qshiver 2.6s ease-in-out infinite}
  @keyframes qshiver{0%,100%{transform:translate(0,0)}25%{transform:translate(.6px,-.5px)}
    50%{transform:translate(-.5px,.5px)}75%{transform:translate(.4px,.4px)}}
  .question.qout{animation:qdissolve .7s ease forwards}
  @keyframes qdissolve{to{opacity:0;filter:blur(5px);letter-spacing:.18em}}

  .opts{display:flex; flex-direction:column; gap:10px; text-align:left}
  .opt{
    border:1px solid var(--rule); background:var(--ink2); color:var(--cream);
    padding:14px 16px; font-size:15.5px; line-height:1.45; cursor:pointer;
    font-family:inherit; text-align:left; width:100%; position:relative; overflow:hidden;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  @media (hover:hover) and (pointer:fine){
    .opt:hover{border-color:var(--gold); background:#201C2E}
  }
  .opt:active{border-color:var(--gold); background:#201C2E}
  .opt:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
  .stepback{display:block;margin:18px auto 0;background:none;border:0;cursor:pointer;
    color:var(--dim);font-family:Helvetica,Arial,sans-serif;font-size:10px;
    letter-spacing:.16em;text-transform:uppercase;opacity:.7;transition:opacity .3s ease}
  .stepback:hover{opacity:1;color:var(--cream)}
  .opts.cascade .opt{opacity:0;animation:optin .5s ease forwards}
  @keyframes optin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .opts.shine .opt:after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;
    background:linear-gradient(100deg, rgba(239,231,216,0), rgba(239,231,216,.10), rgba(239,231,216,0));
    animation:optshine 4.5s ease-in-out infinite}
  @keyframes optshine{0%{left:-40%}60%{left:110%}100%{left:110%}}
  .opt.dissolving{pointer-events:none;border-color:var(--gold);background:#241F33;
    animation:dissolve .85s ease forwards}
  @keyframes dissolve{
    0%{opacity:1;filter:blur(0)}
    30%{box-shadow:0 0 26px rgba(201,164,76,.55)}
    100%{opacity:0;filter:blur(7px);letter-spacing:.32em;transform:scale(1.04)}}
  .opt.fading{pointer-events:none;animation:fadeaway .55s ease forwards}
  @keyframes fadeaway{to{opacity:0;transform:translateY(10px)}}
  .mote{position:fixed;width:3px;height:3px;border-radius:50%;background:var(--gold);
    pointer-events:none;z-index:60;box-shadow:0 0 8px rgba(201,164,76,.8);
    animation:moteup .9s ease-out forwards}
  @keyframes moteup{to{transform:translate(var(--mx),var(--my)) scale(.4);opacity:0}}

  .pop{position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    pointer-events:none; z-index:50;}
  .pop.show{display:flex}
  .pop .ring{
    width:70px;height:70px;border-radius:50%;
    border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    animation:ringPop .55s ease forwards;
    box-shadow:0 0 40px rgba(201,164,76,.45);
    background:rgba(18,16,26,.75);
  }
  .pop .ring span{color:var(--gold); font-size:26px; animation:markIn .55s ease forwards}
  @keyframes ringPop{0%{transform:scale(.3);opacity:0}45%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:0}}
  @keyframes markIn{0%{transform:scale(.2)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
  .stage{animation:fadeUp .5s ease}
  @keyframes fadeUp{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  @keyframes hintpulse{0%,100%{opacity:.45}50%{opacity:1}}
  /* ===== the altar grows with the room — phone untouched, desktop fills ===== */
  @media (min-width:700px){
    .frame{max-width:680px}
    h1{font-size:44px}
    .sub{font-size:19px}
    .question{font-size:26px}
    .opt{font-size:17px;padding:17px 20px}
    .eyewrap{width:min(44vw,340px)}
    .gatename{font-size:52px}
    .body{font-size:17px}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
    .opt,.rsec,.letter,.saidline,.stage{opacity:1 !important; filter:none !important; transform:none !important}
  }
  /* ===== THE REVEAL RITE ===== */
  .breathember{width:10px;height:10px;border-radius:50%;background:var(--gold);margin:30px auto;
    box-shadow:0 0 30px 6px rgba(201,164,76,.55);animation:bheart 2.8s ease-in-out infinite}
  @keyframes bheart{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.65);opacity:1}}
  .saidline{font-style:italic;font-size:clamp(22px,6vw,29px);color:#CDBCF4;line-height:1.6;
    text-shadow:0 0 24px rgba(155,127,212,.5);animation:saidfade 2.4s ease forwards;margin-top:18px}
  @keyframes saidfade{0%{opacity:0;transform:translateY(8px)}18%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0}}
  .gaterow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:28px}
  .gcell{width:52px;padding:10px 0;border:1px solid var(--rule);background:var(--ink2);
    transition:transform .5s ease, border-color .5s ease, box-shadow .5s ease}
  .gsig{font-size:19px;margin-bottom:6px;text-shadow:0 0 12px currentColor}
  .gcount{font-family:Helvetica,Arial,sans-serif;font-size:12px;color:var(--dim)}
  .gcell.fell{animation:cellfall .8s ease forwards}
  @keyframes cellfall{to{opacity:0;filter:blur(5px);transform:translateY(14px) scale(.9)}}
  .gcell.crowned{border-color:var(--gold);box-shadow:0 0 26px rgba(201,164,76,.45);transform:scale(1.14)}
  .letter{opacity:0;display:inline-block;animation:letterin .5s ease forwards}
  @keyframes letterin{from{opacity:0;transform:translateY(10px) scale(.7);filter:blur(4px)}
    to{opacity:1;transform:none;filter:none}}
  .ritestage{min-height:66vh;display:flex;flex-direction:column;
    justify-content:center;align-items:center}
  .gatecolor{font-family:Helvetica,Arial,sans-serif; letter-spacing:.25em; text-transform:uppercase; font-size:11px; margin-bottom:8px}
  .gatename{font-size:42px; letter-spacing:.03em; margin-bottom:6px}
  .triad{margin:20px 0 4px;border-top:1px solid var(--rule);padding-top:16px}
  .triadrow{margin-bottom:12px}
  .triadlabel{font-family:Helvetica,Arial,sans-serif;font-size:10px;letter-spacing:.3em;
    text-transform:uppercase;color:var(--dim);margin-bottom:3px}
  .triadname{font-size:20px}
  .triadline{font-style:italic;font-size:14px;color:var(--dim)}
  .tally{
    font-family:Helvetica,Arial,sans-serif; font-size:10.5px; color:var(--dim);
    letter-spacing:.05em; line-height:1.9; margin:18px 0 22px;
    border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); padding:12px 0;
  }
  .blade{color:#B7A2EE; font-style:italic; font-size:18px; line-height:1.6; margin:20px 0;
    text-shadow:0 0 20px rgba(155,127,212,.45)}
  input.email{
    width:100%; background:var(--ink2); border:1px solid var(--rule); color:var(--cream);
    padding:14px 16px; font-size:15px; font-family:inherit; margin-top:8px;
  }
  input.email:focus{outline:none; border-color:var(--gold)}
  /* ===== THE 13TH PAGE ===== */
  textarea.page13{
    width:100%; min-height:130px; background:var(--ink2); border:1px solid var(--rule);
    color:var(--cream); padding:14px 16px; font-size:16px; font-family:inherit;
    line-height:1.6; resize:vertical; margin-top:14px;
  }
  textarea.page13:focus{outline:none; border-color:var(--violet);
    box-shadow:0 0 24px rgba(155,127,212,.25)}
  button.blankbtn{background:none;border:none;color:var(--dim);cursor:pointer;
    font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.24em;
    text-transform:uppercase;margin-top:18px;padding:8px 14px}
  button.blankbtn:hover{color:var(--cream)}
  .foot{margin-top:24px}
  /* Squarespace's site styles load after this block, so these are pinned by id */
  #app .body, #app .payoff, #app .foot, #app .dim{color:#EFE7D8 !important}
  #app .dim, #app .foot{color:#938BA6 !important}
  #app .payoff{color:#E4DDD1 !important}
  .payoff{max-width:30em;margin:14px auto 4px;padding:16px 18px;text-align:center;
    font-size:15.5px;line-height:1.7;color:#E4DDD1 !important;
    background:rgba(201,164,76,.05);border-top:1px solid rgba(201,164,76,.3);
    border-bottom:1px solid rgba(201,164,76,.3)}
  .freeline{font-family:Helvetica,Arial,sans-serif;font-size:10.5px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--gold);opacity:.9;margin-top:14px;text-align:center}
  /* short lines stay centered; long paragraphs read left so the eye keeps its place */
  .lensp{text-align:left;max-width:31em;margin-left:auto;margin-right:auto}
  @media (max-width:430px){ .lensp{text-align:left} }
  /* ===== THE REFLECTION RITE ===== */
  .rsig{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);font-size:min(60vw,340px);
    opacity:.05;pointer-events:none;z-index:0;text-shadow:0 0 80px currentColor}
  .rsec{opacity:0;animation:rsecin 1.1s ease forwards;animation-delay:var(--rd,0s);margin-bottom:6px}
  @keyframes rsecin{from{opacity:0;transform:translateY(14px);filter:blur(3px)}
    to{opacity:1;transform:none;filter:none}}
  .rtitle{display:flex;align-items:center;gap:14px;margin:26px 0 14px;
    font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.32em;
    text-transform:uppercase;color:var(--gold);text-shadow:0 0 14px rgba(201,164,76,.5)}
  .rtitle:before,.rtitle:after{content:"";flex:1;height:1px;
    background:linear-gradient(90deg,transparent,rgba(201,164,76,.55),transparent)}
  .recho p{font-style:italic;color:#CDBCF4 !important;text-shadow:0 0 18px rgba(155,127,212,.4);
    font-size:17px}
  .rquestion p{font-style:italic;font-size:clamp(19px,4.6vw,24px);line-height:1.6;
    color:#B7A2EE !important;text-shadow:0 0 24px rgba(155,127,212,.5);text-align:center !important}
  .rdoor{border:1px solid rgba(201,164,76,.55);border-radius:6px;padding:20px 22px 18px;
    margin:8px 0 4px;background:linear-gradient(160deg, rgba(201,164,76,.08), rgba(18,16,26,.4));
    box-shadow:0 0 26px rgba(201,164,76,.18), inset 0 1px 0 rgba(239,231,216,.25);
    position:relative;overflow:hidden}
  .rdoor:after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;
    background:linear-gradient(100deg, rgba(239,231,216,0), rgba(239,231,216,.12), rgba(239,231,216,0));
    animation:optshine 4.5s ease-in-out infinite}
  .rwalk{display:inline-block;margin-top:12px;font-family:Helvetica,Arial,sans-serif;
    font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);
    text-decoration:none;border-bottom:1px solid rgba(201,164,76,.55);padding-bottom:2px}
  .rwalk:hover{text-shadow:0 0 12px rgba(201,164,76,.6)}
  .mirrorpulse{animation:pupilbreathe 2.2s ease-in-out infinite}

  .reveal{margin:26px 0 6px;border-top:1px solid var(--rule);padding-top:4px}
  .reveal .body{text-align:left}

  /* ===== THE CARD — the lens leaves the building ===== */
  .cardwrap{margin:34px auto 6px;max-width:340px;text-align:center;
    opacity:0;animation:rsecin 1s ease forwards;animation-delay:.4s}
  .cardshine{position:relative;overflow:hidden;display:block;
    border:1px solid rgba(201,164,76,.45);box-shadow:0 0 34px rgba(201,164,76,.18)}
  .cardimg{width:100%;display:block}
  .cardshine.swept:after{content:"";position:absolute;top:-20%;bottom:-20%;width:38%;left:-50%;
    transform:skewX(-14deg);pointer-events:none;
    background:linear-gradient(100deg, rgba(239,231,216,0), rgba(255,240,200,.30),
      rgba(239,231,216,0));
    animation:cardsweep 5.5s cubic-bezier(.4,0,.2,1) .15s infinite}
  @keyframes cardsweep{0%{left:-50%}34%{left:120%}100%{left:120%}}
  .cardshine.swept{box-shadow:0 0 52px rgba(201,164,76,.30)}
  .cardhint{font-family:Helvetica,Arial,sans-serif;font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--dim);margin-top:12px;line-height:1.8}
  .cardrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .cardbtn{font-family:Helvetica,Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;
    font-size:11.5px;color:#12101A;background:var(--gold);border:none;padding:13px 22px;
    cursor:pointer;text-decoration:none;display:inline-block;
    transition:transform .15s ease, box-shadow .15s ease}
  .cardbtn:hover{transform:translateY(-1px);box-shadow:0 0 22px rgba(201,164,76,.35)}
  .cardbtn:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
  .cardbtn.ghost{background:none;color:var(--gold);border:1px solid rgba(201,164,76,.5)}
  @media (prefers-reduced-motion: reduce){
    .cardwrap{opacity:1 !important;animation:none !important}
    .cardshine.swept:after{display:none}
    .cardrow{opacity:1 !important}
  }
</style>
</head>
<body>
<div class="veil"></div>
<div class="lensglow" id="lensglow"></div>
<div class="deepshade" id="deepshade"></div>
<div class="pop" id="pop" aria-hidden="true"><div class="ring"><span>&#10022;</span></div></div>
<div class="frame" id="app"></div>

<script>
/* ============ CONFIG ============ */
const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxgsybTw7ejoZxxtjefgzpfs10D_xE_P248tC4jgL-UqLZ58Zo1xaDpSs_iuPmDFF_yyw/exec";
const MIRROR_URL = "https://script.google.com/macros/s/AKfycbwcwMIPr9-VumbKwFz3ck8boN16zOjFCKjde3w45bapwTzi5uui4XVi3znvBGqodhqkXw/exec";

/* ============ THE TWELVE LENSES ============
   Jung's archetypes, held as lenses — glass the soul looks through,
   never labels. Nobody IS a lens. */
const LENSES = {
  Innocent:{color:"cream and bone", hex:"#D8CFBB", sig:"\u25C7",
    line:"hope, trust, the fresh start",
    text:"Your answers kept reaching for the good — fresh starts, simple trust, a world that could still be kind. Lately you've been looking through the Innocent: the lens that keeps hope alive after everything. Its gift is faith. Its cost is how hard the world lands when it breaks.",
    blade:"What would it take to trust like that on purpose — eyes open?"},
  Orphan:{color:"stone grey", hex:"#8F8A9E", sig:"\u263E",
    line:"the survivor — real, unfooled, self-made",
    text:"Your answers carried the survivor's knowledge — that nothing is guaranteed, and that you learned to stand because you had to. Lately you've been looking through the Orphan: the lens of the one who made it on their own two feet. Its gift is realness — people feel safe being human around you. Its cost is expecting the leaving before it comes.",
    blade:"Who would you be if you believed someone was staying?"},

function spawnSigils(n){
  for(let i=0;i<n;i++){
    const g=document.createElement("div");
    g.className="floatsigil";
    g.textContent=SIGILS[Math.floor(Math.random()*SIGILS.length)];
    const y0=15+Math.random()*65, drift=(Math.random()<.5?-1:1);
    g.style.setProperty("--sx0",(drift<0?108:-8)+"vw");
    g.style.setProperty("--sx1",(drift<0?-10:110)+"vw");
    g.style.setProperty("--sy0",y0+"vh");
    g.style.setProperty("--sy1",(y0+(Math.random()*16-8))+"vh");
    g.style.setProperty("--sd",(7+Math.random()*6)+"s");
    g.style.setProperty("--so",(0.25+Math.random()*0.35));
    if(Math.random()<.4) g.style.color="var(--violet)";
    document.body.appendChild(g);
    setTimeout(()=>g.remove(),14000);
  }
}
function spawnFallstars(){
  for(let i=0;i<10;i++){
    const f=document.createElement("div");
    f.className="fallstar";
    f.style.left=(Math.random()*100)+"vw";
    f.style.setProperty("--fd",(3.5+Math.random()*3)+"s");
    f.style.animationDelay=(Math.random()*2.5)+"s";
    document.body.appendChild(f);
    setTimeout(()=>f.remove(),7000);
  }
}
function setApproach(idx){
  const fx=QFX[idx]||{};
  lensglow.style.opacity=0.15+ (idx/11)*0.75;
  lensglow.style.transform=`translate(-50%,-50%) scale(${0.7+(idx/11)*0.5})`;
  lensglow.classList.toggle("heart",!!fx.heart);
  lensglow.classList.toggle("focus",!!fx.focus);
  deepshade.classList.toggle("on",!!fx.deep);
  if(fx.sig) spawnSigils(fx.sig);
  if(fx.stars) spawnFallstars();
  return fx;
}

    size(); window.addEventListener("resize",size);
    const GL=LENS_ORDER.map(k=>LENSES[k].sig);
    const CL=LENS_ORDER.map(k=>LENSES[k].hex);
    const N=Math.min(40,Math.max(20,Math.floor(W/17)));
    const px={x:-9999,y:-9999};
    window.addEventListener("pointermove",e=>{ px.x=e.clientX; px.y=e.clientY; },{passive:true});
    window.addEventListener("touchmove",e=>{ const t=e.touches&&e.touches[0]; if(t){ px.x=t.clientX; px.y=t.clientY; } },{passive:true});
    window.addEventListener("touchend",()=>{ px.x=-9999; px.y=-9999; },{passive:true});
    function mk(fresh){
      const li=Math.floor(Math.random()*GL.length);
      return {x:Math.random()*W, y:fresh? -30-Math.random()*H*0.25 : Math.random()*H,
        v:0.1+Math.random()*0.28, dr:(Math.random()-0.5)*0.07,
        g:GL[li], c:CL[li],
        s:11+Math.random()*10, a:0.03+Math.random()*0.08,
        tw:Math.random()*Math.PI*2, ts:0.006+Math.random()*0.016, wake:0};
    }
    let drops=[]; for(let i=0;i<N;i++) drops.push(mk(false));
    let run=true;
    document.addEventListener("visibilitychange",()=>{
      const was=run; run=!document.hidden;
      if(run&&!was) requestAnimationFrame(loop);
    });
    function loop(){
      if(!run) return;
      cx.clearRect(0,0,W,H);
      for(let i=0;i<drops.length;i++){
        const d=drops[i];
        d.y+=d.v; d.x+=d.dr; d.tw+=d.ts;
        const dx=d.x-px.x, dy=d.y-px.y;
        const near=(dx*dx+dy*dy)<15625; /* within 125px — the dark notices the hand */
        d.wake += near ? (1-d.wake)*0.15 : -d.wake*0.04;
        const a=Math.min(0.6, d.a*(0.6+0.4*Math.sin(d.tw)) + d.wake*0.45);
        cx.globalAlpha=a;
        cx.fillStyle=d.c;
        cx.font=(d.s+d.wake*5)+"px Georgia, serif";
        if(d.wake>0.05){ cx.shadowColor=d.c; cx.shadowBlur=16*d.wake; } else { cx.shadowBlur=0; }
        cx.fillText(d.g, d.x, d.y);
        if(d.y>H+34 || d.x<-34 || d.x>W+34) drops[i]=mk(true);
      }
      cx.globalAlpha=1; cx.shadowBlur=0;
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }catch(e){}
})();

/* ===== THE LIVING PUPIL — the eye follows the hand that approaches it ===== */
(function(){
  try{
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    let tx=-9999, ty=-9999, cxp=0, cyp=0;
    window.addEventListener("pointermove",e=>{ tx=e.clientX; ty=e.clientY; },{passive:true});
    window.addEventListener("touchmove",e=>{ const t=e.touches&&e.touches[0]; if(t){ tx=t.clientX; ty=t.clientY; } },{passive:true});
    function loop(){
      const g=document.getElementById("pupilg");
      if(g && tx>-9000){
        const svg=g.ownerSVGElement;
        if(svg){
          const r=svg.getBoundingClientRect();
          const ex=r.left+r.width/2, ey=r.top+r.height*0.5;
          const dx=tx-ex, dy=ty-ey;
          const dist=Math.hypot(dx,dy)||1;
          const m=Math.min(1, dist/260);
          const pxv=(dx/dist)*10*m, pyv=(dy/dist)*7*m;
          cxp+=(pxv-cxp)*0.1; cyp+=(pyv-cyp)*0.1;
          g.setAttribute("transform","translate("+cxp.toFixed(2)+" "+cyp.toFixed(2)+")");
        }
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }catch(e){}
})();

/* ============ SCORING — THE THREE LENSES ============ */
function score(){
  const zero=()=>{const o={};LENS_ORDER.forEach(k=>o[k]=0);return o};
  const all=zero(), heart=zero(), rising=zero();
  answers.forEach(a=>{
    if(!a.lens) return; /* own-words answers ride to the mirror, not the count */
    all[a.lens]++;
    if(a.channel==="heart") heart[a.lens]++;
    if(a.channel==="rising") rising[a.lens]++;
  });
  const overallOrder=Object.entries(all).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  const max=Math.max(...Object.values(all));
  let leaders = max===0 ? ["Innocent"] : LENS_ORDER.filter(k=>all[k]===max);
  let dual=false, tieLeaders=leaders.slice();
  if(leaders.length>1){
    const hmax=Math.max(...leaders.map(k=>heart[k]));
    const hl=leaders.filter(k=>heart[k]===hmax);
    dual=(hl.length>1); tieLeaders=hl;
    leaders=hl;
  }
  const long=leaders[0];
  const pick=(tally,excl)=>{
    const cand=Object.entries(tally).filter(([k,v])=>!excl.includes(k)&&v>0)
      .sort((a,b)=>b[1]-a[1]||all[b[0]]-all[a[0]]);
    return cand.length?cand[0][0]:null;
  };
  const heartLens=pick(heart,[long]) || overallOrder.filter(k=>k!==long)[0];
  const risingLens=pick(rising,[long,heartLens]) || overallOrder.filter(k=>k!==long&&k!==heartLens)[0];

  /* ---- the four drives: what the count knew and never said ---- */
  const fam={}; FAMILY_ORDER.forEach(f=>fam[f]=0);
  answers.forEach(a=>{ if(a.lens && FAMILY[a.lens]) fam[FAMILY[a.lens]]++; });
  const fmin=Math.min(...FAMILY_ORDER.map(f=>fam[f]));
  const shadow=FAMILY_ORDER.filter(f=>fam[f]===fmin)[0];
  const shadowZero=(fmin===0);

  return {all, long, heartLens, risingLens, dual, tieLeaders,
    fam, shadow, shadowZero,
    longFam:FAMILY[long], heartFam:FAMILY[heartLens], risingFam:FAMILY[risingLens]};
}

/* =====================================================================
   THE CARD — twelve hand-made cards, drawn on canvas, no AI, no cost.
   The lens leaves the building and becomes a billboard you didn't pay for.
   ===================================================================== */
const CARD_SERIF='"Palatino Linotype", Palatino, Georgia, serif';
const CARD_SANS='Helvetica, Arial, sans-serif';
let CARD_CANVAS=null, CARD_BLOB=null;

function cHexA(h,a){
  const n=parseInt(h.slice(1),16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";
}
function cWrap(x,text,maxW){
  const words=String(text).split(/\s+/); const lines=[]; let ln="";
  for(let i=0;i<words.length;i++){
    const t=ln?ln+" "+words[i]:words[i];
    if(x.measureText(t).width>maxW && ln){ lines.push(ln); ln=words[i]; }
    else ln=t;
  }
  if(ln) lines.push(ln);
  return lines;
}
function cTrack(x,px){ try{ x.letterSpacing=px+"px"; }catch(e){} }
function cRule(x,cx,y,w,alpha){
  const g=x.createLinearGradient(cx-w/2,y,cx+w/2,y);
  g.addColorStop(0,"rgba(201,164,76,0)");
  g.addColorStop(.5,"rgba(201,164,76,"+alpha+")");
  g.addColorStop(1,"rgba(201,164,76,0)");
  x.fillStyle=g; x.fillRect(cx-w/2,y,w,1.5);
}

/* =========================================================
   THE MINT — the card assembles itself, then holds still.
   Base layer is rendered once and cached so the grain never
   flickers; only the instrument and the type animate.
   ========================================================= */
let CARD_BASE=null, CARD_BASE_KEY="";

function cardBase(g){
  if(CARD_BASE && CARD_BASE_KEY===g.hex) return CARD_BASE;
  const W=1080,H=1350,cx=W/2;
  const c=document.createElement("canvas");
  c.width=W; c.height=H;
  const x=c.getContext("2d");

  const bg=x.createRadialGradient(cx,H*.30,0,cx,H*.30,H*1.05);
  bg.addColorStop(0,"#191426"); bg.addColorStop(.5,"#12101A"); bg.addColorStop(1,"#08070E");
  x.fillStyle=bg; x.fillRect(0,0,W,H);

  const pool=x.createRadialGradient(cx,392,0,cx,392,600);
  pool.addColorStop(0,cHexA(g.hex,.26)); pool.addColorStop(.42,cHexA(g.hex,.08));
  pool.addColorStop(1,cHexA(g.hex,0));
  x.fillStyle=pool; x.fillRect(0,0,W,H);
  const foot=x.createLinearGradient(0,H-300,0,H);
  foot.addColorStop(0,cHexA(g.hex,0)); foot.addColorStop(1,cHexA(g.hex,.10));
  x.fillStyle=foot; x.fillRect(0,H-300,W,300);

  for(let i=0;i<2600;i++){
    x.globalAlpha=.012+Math.random()*.045;
    x.fillStyle=Math.random()<.72?"#EFE7D8":g.hex;
    x.fillRect(Math.random()*W,Math.random()*H,1.1,1.1);
  }
  for(let e=0;e<40;e++){
    x.globalAlpha=.10+Math.random()*.30;
    x.fillStyle="#C9A44C";
    x.beginPath(); x.arc(Math.random()*W,Math.random()*H,.8+Math.random()*2.1,0,6.2832); x.fill();
  }
  x.globalAlpha=1;

  x.strokeStyle="rgba(201,164,76,.20)"; x.lineWidth=1;
  x.strokeRect(38,38,W-76,H-76);
  x.strokeStyle="rgba(201,164,76,.75)"; x.lineWidth=2;
  const bk=54, arm=46;
  [[bk,bk,1,1],[W-bk,bk,-1,1],[bk,H-bk,1,-1],[W-bk,H-bk,-1,-1]].forEach(p=>{
    x.beginPath();
    x.moveTo(p[0]+p[2]*arm,p[1]); x.lineTo(p[0],p[1]); x.lineTo(p[0],p[1]+p[3]*arm);
    x.stroke();
  });

  x.textAlign="center";
  x.fillStyle="#C9A44C"; x.font="24px "+CARD_SANS; cTrack(x,12);
  x.fillText("THE LENS",cx,116); cTrack(x,0);

  CARD_BASE=c; CARD_BASE_KEY=g.hex;
  return c;
}

const RCY=392, RAD=230;

/* P = {ring, dim, lit:[a,b,c], pupil, text, foot} — all 0..1 */
function paintCard(x,long,heart,rising,shadowFam,P){
  const g=LENSES[long], hg=LENSES[heart], rg=LENSES[rising];
  const W=1080,H=1350,cx=W/2;
  x.clearRect(0,0,W,H);
  x.drawImage(cardBase(g),0,0);
  x.textAlign="center";

  /* ---- the rings draw themselves ---- */
  if(P.ring>0){
    const a0=-Math.PI/2, a1=a0+6.2832*P.ring;
    x.strokeStyle=cHexA(g.hex,.20); x.lineWidth=1.2;
    x.beginPath(); x.arc(cx,RCY,RAD+40,a0,a1); x.stroke();
    x.strokeStyle="rgba(201,164,76,.24)"; x.lineWidth=1;
    x.beginPath(); x.arc(cx,RCY,RAD-46,a0,a1); x.stroke();
    x.strokeStyle=cHexA(g.hex,.16*P.ring); x.lineWidth=1;
    for(let i=0;i<24;i++){
      const a=i*(Math.PI/12);
      if(a> 6.2832*P.ring) break;
      x.beginPath();
      x.moveTo(cx+Math.cos(a0+a)*134,RCY+Math.sin(a0+a)*134);
      x.lineTo(cx+Math.cos(a0+a)*182,RCY+Math.sin(a0+a)*182);
      x.stroke();
    }
  }

  /* ---- the twelve ---- */
  const lit=[long,heart,rising];
  LENS_ORDER.forEach((k,i)=>{
    const a=-Math.PI/2 + i*(Math.PI/6);
    const px=cx+Math.cos(a)*RAD, py=RCY+Math.sin(a)*RAD;
    const li=lit.indexOf(k);
    const v = li>-1 ? (P.lit[li]||0) : 0;
    x.save();
    x.fillStyle=LENSES[k].hex;
    if(v>0){
      const sz=30+16*v;
      x.font=sz+"px "+CARD_SERIF;
      x.shadowColor=LENSES[k].hex; x.shadowBlur=34*v;
      x.globalAlpha=Math.min(1,.17+.83*v);
    } else {
      x.font="30px "+CARD_SERIF; x.globalAlpha=.17*P.dim;
    }
    x.fillText(LENSES[k].sig,px,py+12+4*v);
    x.restore();
  });

  /* ---- the pupil ---- */
  if(P.pupil>0){
    const s=.72+.28*P.pupil;
    x.save();
    x.globalAlpha=P.pupil;
    x.fillStyle="rgba(7,6,12,.86)";
    x.beginPath(); x.arc(cx,RCY,126*s,0,6.2832); x.fill();
    x.strokeStyle=cHexA(g.hex,.55); x.lineWidth=1.4; x.stroke();
    x.shadowColor=g.hex; x.shadowBlur=70*P.pupil;
    x.fillStyle=g.hex; x.font=Math.round(130*s)+"px "+CARD_SERIF;
    x.fillText(g.sig,cx,RCY+44*s);
    x.restore();
  }

  /* ---- the type ---- */
  const TOP=716, BOT=1176;
  const rows=[];
  function row(o){
    if(o.divider){ rows.push({divider:true,h:36}); return; }
    x.font=o.font; cTrack(x,o.track||0);
    const lines=o.wrapW?cWrap(x,o.t,o.wrapW):[o.t];
    cTrack(x,0);
    rows.push({lines:lines,font:o.font,color:o.color,lh:o.lh,
      track:o.track||0,glow:o.glow,blur:o.blur,h:lines.length*o.lh});
  }
  row({t:"THE "+long.toUpperCase(), font:"70px "+CARD_SERIF, color:g.hex,
       lh:74, track:3, glow:cHexA(g.hex,.55), blur:32});
  row({t:"YOUR LONG LENS  \u00B7  "+g.color.toUpperCase(), font:"21px "+CARD_SANS,
       color:"#938BA6", lh:40, track:7});
  row({t:g.line, font:"italic 34px "+CARD_SERIF, color:"#EFE7D8", lh:44, wrapW:790});
  row({divider:true});
  row({t:g.blade, font:"italic 43px "+CARD_SERIF, color:"#B7A2EE", lh:53,
       wrapW:840, glow:"rgba(155,127,212,.65)", blur:30});

  const total=rows.reduce((s,r)=>s+r.h,0)+ (hg?38:0)+(rg?38:0)+14+(shadowFam?42:0);
  let y=TOP+Math.max(0,((BOT-TOP)-total)/2)+56;

  if(P.text>0){
    x.save();
    x.globalAlpha=P.text;
    x.translate(0,(1-P.text)*16);
    rows.forEach(r=>{
      if(r.divider){ cRule(x,cx,y-14,200,.45*P.text); y+=r.h; return; }
      x.save();
      if(r.glow){ x.shadowColor=r.glow; x.shadowBlur=(r.blur||24)*P.text; }
      x.fillStyle=r.color; x.font=r.font; cTrack(x,r.track);
      r.lines.forEach(ln=>{ x.fillText(ln,cx,y); y+=r.lh; });
      cTrack(x,0);
      x.restore();
    });
    y+=6;
    if(hg){ x.fillStyle=hg.hex; x.font="27px "+CARD_SERIF;
      x.fillText(hg.sig+"   HEART \u00B7 The "+heart,cx,y); y+=38; }
    if(rg){ x.fillStyle=rg.hex; x.font="27px "+CARD_SERIF;
      x.fillText(rg.sig+"   RISING \u00B7 The "+rising,cx,y); y+=42; }
    if(shadowFam){
      const fh=(typeof FAMILY_HUE!=="undefined" && FAMILY_HUE[shadowFam])||"#8F8A9E";
      x.save();
      x.shadowColor=cHexA(fh,.5); x.shadowBlur=18;
      x.fillStyle=fh; x.font="23px "+CARD_SANS; cTrack(x,6);
      x.fillText("UNCLAIMED  \u00B7  "+shadowFam.toUpperCase(),cx,y);
      cTrack(x,0); x.restore();
    }
    x.restore();
  }

  /* ---- the seal: rarity, then the road back ---- */
  if(P.foot>0){
    x.save();
    x.globalAlpha=P.foot;
    cRule(x,cx,1198,380,.65);
    x.fillStyle="#8E7A44"; x.font="19px "+CARD_SANS; cTrack(x,6);
    x.fillText("ONE OF 1,320 TRIADS  \u00B7  THIS CARD IS A KEY",cx,1236);
    x.fillStyle="#C9A44C"; x.font="26px "+CARD_SANS; cTrack(x,5);
    x.fillText("KOILIBRARYOFFICIAL.COM/THE-LENS",cx,1274);
    x.fillStyle="#938BA6"; x.font="18px "+CARD_SANS; cTrack(x,4);
    x.fillText("TWELVE QUESTIONS  \u00B7  FIVE MINUTES  \u00B7  FREE",cx,1302);
    cTrack(x,0);
    x.restore();
  }
}

const CARD_DONE={ring:1,dim:1,lit:[1,1,1],pupil:1,text:1,foot:1};

function drawCard(long,heart,rising,shadowFam){
  if(!LENSES[long]) return null;
  const c=document.createElement("canvas");
  c.width=1080; c.height=1350;
  paintCard(c.getContext("2d"),long,heart,rising,shadowFam,CARD_DONE);
  return c;
}

/* the mint, in time */
function mintCard(canvasEl,long,heart,rising,shadowFam,done){
  const x=canvasEl.getContext("2d");
  const S=window.KOILSOUND;
  const reduce = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){ paintCard(x,long,heart,rising,shadowFam,CARD_DONE); if(done)done(); return; }

  const seg=(t,a,b)=>Math.max(0,Math.min(1,(t-a)/(b-a)));
  const ease=v=>1-Math.pow(1-v,3);
  const rung=[false,false,false];
  const t0=performance.now();
  const END=2900;

  function frame(now){
    const t=now-t0;
    const P={
      ring:  ease(seg(t,150,950)),
      dim:   ease(seg(t,750,1350)),
      lit:  [ease(seg(t,1300,1650)), ease(seg(t,1600,1950)), ease(seg(t,1900,2250))],
      pupil: ease(seg(t,1450,2050)),
      text:  ease(seg(t,2050,2600)),
      foot:  ease(seg(t,2450,2900))
    };
    if(S && S.isOn && S.isOn()){
      for(let i=0;i<3;i++){
        if(!rung[i] && P.lit[i]>0.05){ rung[i]=true; S.spark(); }
      }
    }
    paintCard(x,long,heart,rising,shadowFam,P);
    if(t<END) requestAnimationFrame(frame);
    else { paintCard(x,long,heart,rising,shadowFam,CARD_DONE); if(done)done(); }
  }
  requestAnimationFrame(frame);
}

function cardBlob(cb){
  try{
    if(CARD_BLOB) return cb(CARD_BLOB);
    if(!CARD_CANVAS || !CARD_CANVAS.toBlob) return cb(null);
    CARD_CANVAS.toBlob(b=>{ CARD_BLOB=b; cb(b); },"image/png");
  }catch(e){ cb(null); }
}
function saveCard(btn){
  cardBlob(b=>{
    try{
      if(!b){
        if(navigator.clipboard) navigator.clipboard.writeText("https://koilibraryofficial.com/the-lens");
        if(btn) btn.textContent="Link copied";
        return;
      }
      const a=document.createElement("a");
      a.href=URL.createObjectURL(b); a.download="my-lens.png";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      if(btn) btn.textContent="Saved";
    }catch(e){}
  });
}
function passCard(btn){

      let file=null;
      try{ if(b && window.File) file=new File([b],"my-lens.png",{type:"image/png"}); }catch(e){}
      if(file && navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file],text:msg+" "+url}).catch(()=>{}); return;
      }
      if(navigator.share){
        navigator.share({title:"The Lens",text:msg,url:url}).catch(()=>{}); return;
      }
      saveCard(btn);
    }catch(e){ saveCard(btn); }
  });
}

      }catch(e){}

      hint.innerHTML="This card is a key \u2014 the Deep Mirror reads it.<br>Press and hold to save, or pass it on.";
      row.style.opacity="1";
      if(box._why) box._why.style.opacity="1";
      const S=window.KOILSOUND;
      if(S && S.isOn && S.isOn()) S.level();
    });
  }catch(e){}
}

/* ============ THE REFLECTION — the Soul Mirror speaks ============ */
function mirrorSections(t){
  t=t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  t=t.replace(/\*\*(.+?)\*\*/g,"<strong style=\"color:var(--gold)\">$1</strong>");
  t=t.replace(/\*(.+?)\*/g,"<em>$1</em>");
  const lines=t.split(/\n/);
  const secs=[]; let cur={title:"",body:[]};
  lines.forEach(L=>{
    const h=L.match(/^#{2,4}\s*(.+)\s*$/);
    if(h){
      if(cur.title||cur.body.join("").trim()) secs.push(cur);
      cur={title:h[1].replace(/<[^>]+>/g,"").trim(),body:[]};
    } else if(/^\s*-{3,}\s*$/.test(L)){ /* section rules become the stagger itself */ }
    else cur.body.push(L);
  });
  secs.push(cur);
  return secs.filter(x=>x.title||x.body.join("").trim());
}
function paras(bodyLines){
  return bodyLines.join("\n").split(/\n\n+/).map(p=>p.trim()).filter(Boolean)
    .map(p=>'<p class="body" style="text-align:left">'+p.replace(/\n/g,"<br>")+"</p>").join("");
}
function showReflection(long){
  const g=LENSES[long]||LENSES.Innocent;
  lensglow.style.opacity=1;
  lensglow.style.background=`radial-gradient(circle, ${g.hex}44 0%, ${g.hex}18 45%, rgba(0,0,0,0) 70%)`;
  app.innerHTML=`
  <div class="stage ritestage" style="min-height:60vh">
    <div class="kicker">The Soul Mirror</div>
    <div class="rule"></div>
    <div class="mirrorpulse" style="font-size:34px;color:${g.hex};text-shadow:0 0 26px ${g.hex}">${g.sig}</div>
    <p class="sub" style="animation:hintpulse 2s ease-in-out infinite">The mirror is reading what you gave it...</p>
  </div>`;
  const p=window.mirrorPromise||Promise.resolve({line:""});
  p.then(data=>{
    const line=(data&&data.line)?data.line:"";
    let inner="";
    if(!line){
      inner=`<p class="body center">The mirror held its silence this time — but your words were kept, and a person will read them. Some reflections arrive by hand.</p>`;
    } else {
      const secs=mirrorSections(line);
      if(secs.length<=1){
        inner=`<div class="rsec" style="--rd:.3s">${paras(secs.length?secs[0].body:[line])}</div>`;
      } else {
        inner=secs.map((sec,i)=>{
          const T=(sec.title||"").toUpperCase();
          const delay=(0.4+i*1.15).toFixed(2)+"s";
          let cls="", bodyHtml=paras(sec.body);
          if(T.indexOf("ECHO")>-1) cls="recho";
          if(T.indexOf("QUESTION")>-1){ cls="rquestion"; }
          if(T.indexOf("JOURNEY")>-1){
            bodyHtml='<div class="rdoor">'+bodyHtml+
              '<a class="rwalk" href="/the-journeys">Walk this journey &rarr;</a></div>';
          }
          return `<div class="rsec ${cls}" style="--rd:${delay}">`+
            (sec.title?`<div class="rtitle">${sec.title}</div>`:"")+bodyHtml+`</div>`;
        }).join("");
      }
    }
    app.innerHTML=`
    <div class="stage" style="max-width:640px;position:relative">
      <div class="rsig" style="color:${g.hex}">${g.sig}</div>
      <div class="kicker">The Soul Mirror &middot; through the ${long} lens</div>
      <div class="rule"></div>
      ${inner}
      <div class="rule" style="margin:30px auto 22px"></div>
      <div class="rsec" style="--rd:${line?"6s":"1s"};text-align:center">
        <div class="rtitle">The next step</div>
        <div class="rdoor" style="margin-top:6px;text-align:left">
          <p class="body" style="text-align:left;margin:0 0 10px">${DEEP_PUSH[long]||""}</p>
          <p class="body" style="text-align:left;margin:0 0 10px">The mirror walks in already knowing the lens you carry from here — <strong style="color:var(--gold)">your card is a key, and this device already holds it.</strong> When you finish, it weaves everything into one reading, in eight chambers:</p>
          <p class="dim" style="text-align:left;line-height:2;margin:0 0 12px"><span style="color:var(--gold)">THE ECHO</span> &middot; your own sentences, returned&nbsp;&nbsp;<span style="color:var(--gold)">THE THREADS</span> &middot; patterns across your pages you never connected&nbsp;&nbsp;<span style="color:var(--gold)">THE PICTURE</span> &middot; one image that holds your whole walk&nbsp;&nbsp;<span style="color:var(--gold)">THE LIGHT &amp; THE SHADOW</span> &middot; your strengths, and where each one bites&nbsp;&nbsp;<span style="color:var(--gold)">THE LENSES</span> &middot; this lens weighed against your own evidence&nbsp;&nbsp;<span style="color:var(--gold)">THE STUDY</span> &middot; what to learn next, and the questions to keep&nbsp;&nbsp;<span style="color:var(--gold)">THE SEVEN-DAY WALK</span> &middot; seven days, built from your words&nbsp;&nbsp;<span style="color:var(--gold)">THE QUESTION</span> &middot; the one you've been avoiding</p>
          <p class="dim" style="text-align:left;font-style:italic;margin:0 0 14px">One page stays sealed from everyone — even the mirror. And no human being reads a word unless you choose to open the door.</p>
          <a class="rwalk" href="https://koilibraryofficial.com/the-deep-mirror">Enter the Deep Mirror &middot; $33 &rarr;</a>
        </div>
        <div class="rtitle" style="margin-top:30px">Open now</div>
        <div class="rdoor" style="text-align:left">
          <p class="body" style="text-align:left;margin:0 0 10px"><strong style="color:var(--gold)">My Caloric Mirror</strong> and <strong style="color:var(--gold)">The Steady Face</strong> are both open now &mdash; the first two doors of the library, forged from the forty-day fast. The Mirror Kit and The Room I Managed open next; dates to be announced.</p>
          <a class="rwalk" href="${STEADY_FACE_URL}">Walk The Steady Face &rarr;</a>
          <br>
          <a class="rwalk" style="margin-top:10px;display:inline-block" href="${CALORIC_URL}">Walk My Caloric Mirror &rarr;</a>
        </div>
        <div class="rtitle" style="margin-top:30px">Your most illuminating journey</div>
        <div class="rdoor" style="text-align:left">
          <p class="body" style="text-align:left;margin:0 0 10px">Through the ${long} lens, the journey holding the most light for you is <strong style="color:var(--gold)">${(LENS_JOURNEY[long]||{}).name||"the corridor"}</strong> &mdash; ${(LENS_JOURNEY[long]||{}).line||"walk the corridor and see"}.</p>
          <a class="rwalk" href="${JOURNEYS_URL}">See this journey &rarr;</a>
        </div>
        <p class="dim foot">A reflection, not a verdict — you outrank the mirror. Not diagnosis or therapy; deep water deserves real support. In the U.S., call or text 988 any hour.<br><br><a href="/" style="color:#938BA6">Return to the corridor</a></p>
      </div>
    </div>`;
    window.scrollTo({top:0,behavior:"smooth"});
  });
}

<script>
/* ===== KOIL SOUND — one soul for the whole kingdom ===== */
window.KOILSOUND=(function(){
  var ctx=null,filt=null,master=null,on=false,amb=[],chimeT=null,chordT=null,chordI=0;
  var CH=[[110,130.81,164.81],[87.31,110,130.81],[130.81,164.81,196],[98,123.47,146.83],[110,130.81,164.81],[82.41,123.47,164.81]];
  var NOTES=[523.25,587.33,659.25,783.99,880];
  function init(){
    if(!ctx){
      var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
      ctx=new AC();
      filt=ctx.createBiquadFilter(); filt.type="lowpass"; filt.frequency.value=420; filt.Q.value=0.6;
      master=ctx.createGain(); master.gain.value=0.55;
      filt.connect(master); master.connect(ctx.destination);
    }
    if(ctx.state==="suspended") ctx.resume();
    return true;
  }
  function tone(f,d,o){
    o=o||{}; if(!on||!init()) return;
    var t=ctx.currentTime+(o.delay||0);
    var osc=ctx.createOscillator(),g=ctx.createGain();
    osc.type=o.type||"sine"; osc.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(o.gain||0.07,t+(o.attack||0.012));
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    osc.connect(g); g.connect(o.dest||master); osc.start(t); osc.stop(t+d+0.05);
  }
  function chord(fs){
    if(!init()) return;
    var t=ctx.currentTime;
    fs.forEach(function(f,i){
      [["sine",0],["triangle",1.5]].forEach(function(w){
        var osc=ctx.createOscillator(),g=ctx.createGain();
        osc.type=w[0]; osc.frequency.value=f; osc.detune.value=w[1]+(i-1)*2;
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(0.02,t+3);
        g.gain.setValueAtTime(0.02,t+7);
        g.gain.linearRampToValueAtTime(0.0001,t+11);
        osc.connect(g); g.connect(filt); osc.start(t); osc.stop(t+11.5);
      });
    });
  }
  var windGain=null,windTarget=0,windIv=null;
  function windOn(){
    if(!init()||windGain) return;
    var len=Math.floor(ctx.sampleRate*2),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
    var src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
    var bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=340; bp.Q.value=0.8;
    windGain=ctx.createGain(); windGain.gain.value=0;
    src.connect(bp); bp.connect(windGain); windGain.connect(master); src.start();
    amb.push(src);
    windIv=setInterval(function(){
      if(!windGain) return;
      var cur=windGain.gain.value;
      windGain.gain.linearRampToValueAtTime(cur+(windTarget-cur)*0.35,ctx.currentTime+0.12);
      windTarget*=0.82;
    },120);
  }
  function startAmb(){
    if(!init()||amb.length) return;
    var o=ctx.createOscillator(),g=ctx.createGain(),l=ctx.createOscillator(),lg=ctx.createGain();
    o.type="sine"; o.frequency.value=55; g.gain.value=0.03;
    l.type="sine"; l.frequency.value=0.07; lg.gain.value=0.012;
    l.connect(lg); lg.connect(g.gain); o.connect(g); g.connect(filt); o.start(); l.start();
    amb.push(o,l);
    windOn();
    var loop=function(){ if(on){ chord(CH[chordI%CH.length]); chordI++; chordT=setTimeout(loop,9000);} };
    loop();
    var chime=function(){
      if(!on) return;
      var f=NOTES[Math.floor(Math.random()*NOTES.length)]*(Math.random()<0.4?0.5:1);
      tone(f,2.6,{gain:0.02,attack:0.4});
      chimeT=setTimeout(chime,7000+Math.random()*12000);
    };
    chimeT=setTimeout(chime,4000);
  }
  function stopAmb(){
    clearTimeout(chimeT); clearTimeout(chordT);
    if(windIv){ clearInterval(windIv); windIv=null; }
    amb.forEach(function(n){ try{ n.stop?n.stop():n.disconnect(); }catch(e){} });
    amb=[]; windGain=null;
  }
  return {
    setOn:function(v){ on=v; if(v){ if(init()){ startAmb(); tone(659.25,0.35,{gain:0.06}); } } else stopAmb(); },
    isOn:function(){ return on; },
    ui:function(){ var f=460+Math.random()*140; tone(f,0.09,{gain:0.028,type:"triangle"}); tone(f*3.02,0.06,{gain:0.012,delay:0.01}); },
    door:function(){
      if(!on||!init()) return;
      var dur=0.55,t=ctx.currentTime;
      var len=Math.floor(ctx.sampleRate*dur),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
      for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
      var src=ctx.createBufferSource(); src.buffer=buf;
      var bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=1.1;
      bp.frequency.setValueAtTime(260,t); bp.frequency.exponentialRampToValueAtTime(1500,t+dur*0.8);
      var g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.045,t+0.06);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      src.connect(bp); bp.connect(g); g.connect(master); src.start(t);
      tone(110,0.4,{gain:0.04});
    },
    enter:function(){
      if(!on||!init()) return;
      var t=ctx.currentTime;
      [[55,110],[82.41,164.81]].forEach(function(p,i){
        var osc=ctx.createOscillator(),g=ctx.createGain();
        osc.type="sine"; osc.frequency.setValueAtTime(p[0],t);
        osc.frequency.exponentialRampToValueAtTime(p[1],t+1.5);
        g.gain.setValueAtTime(0.0001,t);
        g.gain.linearRampToValueAtTime(0.055-i*0.015,t+1.1);
        g.gain.exponentialRampToValueAtTime(0.0001,t+2.4);
        osc.connect(g); g.connect(filt); osc.start(t); osc.stop(t+2.6);
      });
      [659.25,783.99,1046.5].forEach(function(f,i){ tone(f,1.4,{gain:0.03,delay:0.9+i*0.18,attack:0.2}); });
    },
    deposit:function(){ tone(880,0.5,{gain:0.06}); tone(1318.5,0.7,{gain:0.045,delay:0.07}); },
    sting:function(){ tone(659.25,0.4,{gain:0.06}); tone(987.77,0.6,{gain:0.05,delay:0.1}); },
    level:function(){ [523.25,659.25,783.99,1046.5].forEach(function(f,i){ tone(f,0.55,{gain:0.06,delay:i*0.12}); }); },
    spark:function(){ tone(1567.98,0.9,{gain:0.045,attack:0.05}); tone(2093,1.1,{gain:0.03,delay:0.12,attack:0.06}); },
    tick:function(){ tone(440,0.12,{gain:0.03,type:"triangle"}); },
    wind:function(v){ windTarget=Math.min(0.06,Math.max(windTarget,v)); }
  };
})();

/* ===== wiring: toggle, ticks, page hooks ===== */
(function(){
  var S=window.KOILSOUND;
  /* the toggle glyph */
  var b=document.createElement("button");
  b.id="koilsnd"; b.textContent="\u266A";
  b.title="Wake the kingdom's sound";
  b.style.cssText="position:fixed;right:14px;bottom:12px;z-index:40;background:rgba(10,9,16,.55);border:1px solid rgba(147,139,166,.35);color:#5a5470;width:34px;height:34px;border-radius:50%;font-size:14px;cursor:pointer;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);transition:color .4s ease, box-shadow .4s ease";
  document.body.appendChild(b);
  function paint(){
    b.style.color=S.isOn()?"#C9A44C":"#5a5470";
    b.style.boxShadow=S.isOn()?"0 0 14px rgba(201,164,76,.4)":"none";
    b.title=S.isOn()?"The kingdom hums \u2014 tap for silence":"Wake the kingdom's sound";
  }
  b.addEventListener("click",function(e){
    e.stopPropagation();
    var v=!S.isOn();
    S.setOn(v);
    try{ localStorage.setItem("koil_sound",v?"1":"0"); }catch(err){}
    paint();
  });
  /* returning listener: sound wakes on first touch */
  var want=false;
  try{ want=localStorage.getItem("koil_sound")==="1"; }catch(e){}
  if(want){
    var arm=function(){ S.setOn(true); paint(); };
    window.addEventListener("pointerdown",arm,{once:true});
    window.addEventListener("touchstart",arm,{once:true});
  }
  /* every button and link ticks */
  document.addEventListener("pointerdown",function(e){
    if(e.target && e.target.closest && e.target.closest("button, a, .btn, .gate-btn, .rwalk, .dl, .cardbtn")) S.ui();
  });
  /* corridor hooks live only where stations exist — the Lens carries none */
  var stations=Array.prototype.slice.call(document.querySelectorAll(".station"));
  if(stations.length){
    var lastY=window.scrollY,lastT=performance.now();
    var states=stations.map(function(){ return false; });
    var step=function(){
      var y=window.scrollY,t=performance.now(),dt=Math.max(16,t-lastT);
      var v=Math.abs(y-lastY)/dt;              /* px per ms */
      if(v>0.05) S.wind(Math.min(0.06,v*0.045));
      lastY=y; lastT=t;
      var max=document.documentElement.scrollHeight-window.innerHeight;
      var p=max>0?y/max:0;
      stations.forEach(function(st,i){
        var c=parseFloat(st.dataset.c||"0");
        var w=st.classList.contains("whisper")?0.030:0.072;
        var onNow=Math.abs(p-c)<w;
        if(onNow&&!states[i]){
          if(st.classList.contains("whisper")) S.spark(); else S.sting();
        }
        states[i]=onNow;
      });
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  /* chamber + rite arrivals: glances chime, room-glances ring, the woven reading sings */
  var lastRsec=0;
  var mo=new MutationObserver(function(muts){
    for(var m=0;m<muts.length;m++){
      var added=muts[m].addedNodes;
      for(var i=0;i<added.length;i++){
        var n=added[i];
        if(!n.classList) continue;
        if(n.classList.contains("roomglance")){ S.enter(); return; }
        if(n.classList.contains("glance")){ S.deposit(); return; }
        if(n.classList.contains("cardwrap")){ S.level(); return; }
        if(n.classList.contains("rsec")){
          var now=Date.now();
          if(now-lastRsec>1500){ lastRsec=now; S.level(); }
          return;
        }
        if(n.querySelector && n.querySelector(".rsec")){
          var now2=Date.now();
          if(now2-lastRsec>1500){ lastRsec=now2; S.level(); }
          return;
        }
      }
    }
  });
  mo.observe(document.body,{childList:true,subtree:true});
})();
